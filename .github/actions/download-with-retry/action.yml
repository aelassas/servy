# ==========================================================================================
# Shared Composite Action - Resilient Download with Backoff Retry
# ------------------------------------------------------------------------------------------
# Centralizes network asset collection loops across the pipeline ecosystem.
# Guarantees uniform backoff telemetry and error boundary management for transient downloads.
# ==========================================================================================

name: 'Download with Retry'
description: 'Downloads a file via Invoke-WebRequest wrapped in a resilient backoff loop'

inputs:
  url:
    description: 'The source URL of the file asset to download'
    required: true
  output_path:
    description: 'The target destination file path on disk'
    required: true
  asset_name:
    description: 'Descriptive name of the asset used in logging contexts'
    required: true
  max_retries:
    description: 'Maximum number of network connection attempts before breaking out'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Execute Resilient Download Loop
      shell: pwsh
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_ASSET_NAME: ${{ inputs.asset_name }}
        INPUT_MAX_RETRIES: ${{ inputs.max_retries }}
      run: |
        $url     = $env:INPUT_URL
        # Expand any literal environment variable expressions (e.g. $env:USERPROFILE) passed in output_path
        $out     = [Environment]::ExpandEnvironmentVariables($env:INPUT_OUTPUT_PATH)
        $asset   = $env:INPUT_ASSET_NAME
        $retries = [int]$env:INPUT_MAX_RETRIES
        
        # Ensure destination directory exists prior to initiating download stream
        $parentDir = Split-Path -Path $out -Parent
        if ($parentDir -and -not (Test-Path -Path $parentDir)) {
            New-Item -ItemType Directory -Force -Path $parentDir | Out-Null
        }

        for ($i = 0; $i -lt $retries; $i++) {
            try {
                Invoke-WebRequest -Uri $url -OutFile $out -ErrorAction Stop
                break
            }
            catch {
                if ($i -eq ($retries - 1)) { 
                    throw "Failed to download $asset after $retries attempts. Error: $_" 
                }
                $delay = 3 * [math]::Pow(2, $i)
                Write-Host "Transient download failure for $asset. Retrying in $delay seconds... (Attempt $($i + 1)/$retries)"
                Start-Sleep -Seconds $delay
            }
        }