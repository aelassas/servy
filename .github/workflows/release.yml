# ==============================================================
#  GitHub Actions Workflow - Release
# --------------------------------------------------------------
#  Purpose:
#    This workflow provides a unified "release" badge
#    that reflects the combined status of the following workflows:
#      - winget.yml        -> Publishes the WinGet manifest
#      - choco.yml         -> Publishes the Chocolatey package
#      - scoop.yml         -> Publishes the Scoop manifest to aelassas/scoop-bucket
#      - bump-version.yml -> Bumps version
#      - changelog.yml    -> Updates the project changelog
#
#  Behavior:
#    • Automatically runs after any of the above workflows complete.
#    • Checks their latest runs.
#    • Fails if any of them failed, were skipped, or did not run.
#    • Can also be triggered manually from the GitHub Actions tab.
#
#  Badge:
#    ![release](https://github.com/aelassas/servy/actions/workflows/release.yml/badge.svg)
#
#  Result:
#    Green  -> All release workflows succeeded
#    Yellow -> One or more still in progress.
#    Red    -> One or more failed, skipped, or missing
# ==============================================================
name: release

env:
  RELEASE_WORKFLOWS: "winget,choco,scoop,bump-version,changelog"

on:
  workflow_run:
    workflows: ["winget", "choco", "scoop", "bump-version", "changelog"]
    types: [completed]
  workflow_dispatch:  # Manual trigger

permissions:
  actions: read
  contents: read

jobs:
  check-release-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check release workflows status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const workflows = process.env.RELEASE_WORKFLOWS.split(',');
            const failed = [];
            const pending = [];

            for (const wf of workflows) {
              let run;
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: `${wf}.yml`,
                  per_page: 1,
                });
                run = runs.data.workflow_runs[0];
              } catch (e) {
                if (e.status === 404) {
                  console.log(`${wf} (workflow not found)`);
                  failed.push(`${wf} (workflow not found)`);
                  continue;
                }
                throw e;
              }

              if (run) {
                console.log(`${wf}: ${run.conclusion}`);
                if (run.conclusion === null) {
                  pending.push(wf);
                } else if (run.conclusion !== "success") {
                  failed.push(wf);
                }
              } else {
                console.log(`${wf} (no runs found)`);
                failed.push(`${wf} (no runs found)`);
              }
            }

            if (failed.length > 0) {
              core.setFailed(`Release criteria not met. Failed/Missing: ${failed.join(", ")}`);
            } else if (pending.length > 0) {
              core.warning(`Release status is incomplete. Pending: ${pending.join(", ")}`);
            } else {
              console.log("All release workflows succeeded!");
            }
