# ==========================================================================================
# GitHub Actions Workflow - WinGet
# ------------------------------------------------------------------------------------------
# Publishes a Servy release to WinGet when a new GitHub
# release is published or when manually triggered. It
# resolves the release tag (the published release; on a
# manual run the `tag` input, else the latest release),
# force-syncs the aelassas/winget-pkgs fork's master
# branch with upstream, and submits the x64 and ARM64
# installers through winget-releaser. A manual run with
# `skip_publish` set skips the submission step.
# ==========================================================================================

name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: false
      skip_publish:
        description: 'Skip the WinGet submission (the fork sync still runs)'
        type: boolean
        required: false
        default: false

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Resolve release version
        uses: ./.github/actions/resolve-version
        with:
          manual_tag: ${{ inputs.tag }}
          release_tag: ${{ github.event.release.tag_name }}

      - name: Sync winget-pkgs fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh repo sync aelassas/winget-pkgs --branch master --force

      - name: Publish Servy to WinGet
        if: ${{ inputs.skip_publish != true }}
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e #v2
        with:
          identifier: aelassas.Servy
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: "servy-\\d+\\.\\d+-(x64|arm64)-installer\\.exe$"
          release-tag: ${{ env.TAG }}
          fork-user: aelassas
