# ===========================================
# GitHub Actions Workflow - Build (net48)
# -------------------------------------------
# Builds the Servy solution targeting .NET Framework 4.8
# and verifies critical reflection hooks.
# ===========================================

name: build

on:
  push:
    branches:
      - net48
  pull_request:
    branches:
      - net48
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 #v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 #v4.0

      - name: Restore NuGet packages
        run: nuget restore Servy.sln

      - name: Build Solution (Debug)
        run: |
          msbuild Servy.sln `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:AllowUnsafeBlocks=true `
            /nodeReuse:false `
            /m

      - name: Build Solution (Release)
        run: |
          msbuild Servy.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AllowUnsafeBlocks=true `
            /nodeReuse:false `
            /m
