# ===========================================
# GitHub Actions Workflow - Choco
# -------------------------------------------
# Packages and publishes the Servy installer to
# Chocolatey when a new GitHub release is published
# or when manually triggered. It downloads the latest
# installer, computes the SHA256 checksum, updates
# nuspec and install scripts, commits the changes,
# and pushes the package to Chocolatey.
# ===========================================

name: choco

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: false
      skip_push:
        description: 'Skip pushing package to Chocolatey feed'
        type: boolean
        required: false
        default: false

concurrency:
  group: choco-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  choco:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # Needed here to push commits back
    env:
      MAX_RETRIES: 5
      SKIP_CHOCO_PUSH: ${{ inputs.skip_push == true }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Initialize Git Script Helpers
        uses: ./.github/actions/setup-git-helpers

      - name: Set version vars
        uses: ./.github/actions/resolve-version
        with:
          manual_tag: ${{ github.event.inputs.tag }}
          release_tag: ${{ github.event.release.tag_name }}

      - name: Stage Installer Download Targets
        shell: pwsh
        run: |
          $url64 = "https://github.com/aelassas/servy/releases/download/${env:TAG}/servy-${env:VERSION}-x64-installer.exe"
          $out64 = "servy-${env:VERSION}-x64-installer.exe"
          $urlArm64 = "https://github.com/aelassas/servy/releases/download/${env:TAG}/servy-${env:VERSION}-arm64-installer.exe"
          $outArm64 = "servy-${env:VERSION}-arm64-installer.exe"

          Write-Host "Staging Chocolatey asset lookup paths for x64 ($url64) and arm64 ($urlArm64)"
          Add-Content -Path $env:GITHUB_ENV -Value "CHOCO_DOWNLOAD_URL_64=$url64"
          Add-Content -Path $env:GITHUB_ENV -Value "CHOCO_DOWNLOAD_OUT_64=$out64"
          Add-Content -Path $env:GITHUB_ENV -Value "CHOCO_DOWNLOAD_URL_ARM64=$urlArm64"
          Add-Content -Path $env:GITHUB_ENV -Value "CHOCO_DOWNLOAD_OUT_ARM64=$outArm64"

      - name: Download x64 installer
        uses: ./.github/actions/download-with-retry
        with:
          url: ${{ env.CHOCO_DOWNLOAD_URL_64 }}
          output_path: ${{ env.CHOCO_DOWNLOAD_OUT_64 }}
          asset_name: 'Servy x64 Release Installer for Chocolatey'
          max_retries: ${{ env.MAX_RETRIES }}

      - name: Download arm64 installer
        uses: ./.github/actions/download-with-retry
        with:
          url: ${{ env.CHOCO_DOWNLOAD_URL_ARM64 }}
          output_path: ${{ env.CHOCO_DOWNLOAD_OUT_ARM64 }}
          asset_name: 'Servy arm64 Release Installer for Chocolatey'
          max_retries: ${{ env.MAX_RETRIES }}

      - name: Compute SHA256
        shell: pwsh
        run: |
          $HASH64 = (Get-FileHash "servy-${env:VERSION}-x64-installer.exe" -Algorithm SHA256).Hash.ToUpper()
          $HASHARM64 = (Get-FileHash "servy-${env:VERSION}-arm64-installer.exe" -Algorithm SHA256).Hash.ToUpper()

          Add-Content -Path $env:GITHUB_ENV -Value "HASH_64=$HASH64"
          Add-Content -Path $env:GITHUB_ENV -Value "HASH_ARM64=$HASHARM64"

      - name: Update nuspec version and release notes
        shell: pwsh
        run: |
          $file = "setup/choco/servy/servy.nuspec"
          $content = Get-Content $file -Raw

          $versionPattern = '<version>.*?</version>'
          if (-not [regex]::IsMatch($content, $versionPattern)) { throw "Pattern '$versionPattern' not found in $file - aborting to avoid publishing stale version." }
          $content = $content -replace $versionPattern, "<version>${env:VERSION}.0</version>"

          $notesPattern = '(?s)<releaseNotes>.*?</releaseNotes>'
          if (-not [regex]::IsMatch($content, $notesPattern)) { throw "Pattern '$notesPattern' not found in $file - aborting to avoid publishing stale release notes." }
          $content = $content -replace $notesPattern, "<releaseNotes>Release for version ${env:VERSION}.0. See https://github.com/aelassas/servy/releases/tag/${env:TAG}</releaseNotes>"

          $iconPattern = '<iconUrl>.*?</iconUrl>'
          if (-not [regex]::IsMatch($content, $iconPattern)) { throw "Pattern '$iconPattern' not found in $file - aborting to avoid publishing stale iconUrl." }
          $content = $content -replace $iconPattern, "<iconUrl>https://cdn.jsdelivr.net/gh/aelassas/servy@${env:TAG}/src/Servy/servy.ico</iconUrl>"

          # Write without adding extra newline
          [System.IO.File]::WriteAllText($file, $content)

      - name: Update chocolateyinstall.ps1
        shell: pwsh
        run: |
          $file = "setup/choco/servy/tools/chocolateyinstall.ps1"
          $content = Get-Content $file -Raw

          # Build replacement strings for x64 and arm64 architectures
          $url64Replacement = "`$url64         = 'https://github.com/aelassas/servy/releases/download/${env:TAG}/servy-${env:VERSION}-x64-installer.exe'"
          $checksum64Replacement = "`$checksum64    = '${env:HASH_64}'"
          $urlArm64Replacement = "`$urlArm64      = 'https://github.com/aelassas/servy/releases/download/${env:TAG}/servy-${env:VERSION}-arm64-installer.exe'"
          $checksumArm64Replacement = "`$checksumArm64 = '${env:HASH_ARM64}'"

          Write-Host "URL64: $url64Replacement"
          Write-Host "HASH64: $checksum64Replacement"
          Write-Host "URLARM64: $urlArm64Replacement"
          Write-Host "HASHARM64: $checksumArm64Replacement"

          # Assert match before replacing to avoid silent no-op failures
          $url64Pattern = [regex]::Escape('$url64') + '\s*=.*'
          if (-not [regex]::IsMatch($content, $url64Pattern)) { throw "Pattern '$url64Pattern' not found in $file - aborting to avoid publishing a stale url64." }
          $content = [regex]::Replace($content, $url64Pattern, $url64Replacement)

          $checksum64Pattern = [regex]::Escape('$checksum64') + '\s*=.*'
          if (-not [regex]::IsMatch($content, $checksum64Pattern)) { throw "Pattern '$checksum64Pattern' not found in $file - aborting to avoid publishing a stale checksum64." }
          $content = [regex]::Replace($content, $checksum64Pattern, $checksum64Replacement)

          $urlArm64Pattern = [regex]::Escape('$urlArm64') + '\s*=.*'
          if (-not [regex]::IsMatch($content, $urlArm64Pattern)) { throw "Pattern '$urlArm64Pattern' not found in $file - aborting to avoid publishing a stale urlArm64." }
          $content = [regex]::Replace($content, $urlArm64Pattern, $urlArm64Replacement)

          $checksumArm64Pattern = [regex]::Escape('$checksumArm64') + '\s*=.*'
          if (-not [regex]::IsMatch($content, $checksumArm64Pattern)) { throw "Pattern '$checksumArm64Pattern' not found in $file - aborting to avoid publishing a stale checksumArm64." }
          $content = [regex]::Replace($content, $checksumArm64Pattern, $checksumArm64Replacement)

          # Write content back without extra newline
          [System.IO.File]::WriteAllText($file, $content)

      - name: Commit and Push (with Retry)
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\git-helpers.ps1"
          Invoke-Git config user.name "github-actions[bot]"
          Invoke-Git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there is actually anything to commit
          $hasChanges = (Invoke-Git status --porcelain setup/choco/servy/*) -join "`n"
          if ([string]::IsNullOrWhiteSpace($hasChanges)) {
              Write-Host "No changes to commit. Skipping push."
              exit 0
          }

          Invoke-Git add setup/choco/servy/*

          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
              Invoke-Git commit -m "chore(choco): update package for version ${env:VERSION}"

              # Env vars are strings; -MaxRetries is [int]
              $maxRetries = [int]$env:MAX_RETRIES
              Invoke-PushWithRetry -PullRef 'main' -PushRef 'HEAD:main' -MaxRetries $maxRetries
          } else {
              Write-Host "Index is clean after staging. Skipping commit and push."
          }

      - name: Check Chocolatey version
        shell: pwsh
        run: choco --version

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          choco pack setup/choco/servy/servy.nuspec --out setup/choco/servy
          if ($LASTEXITCODE -ne 0) {
              throw "choco pack failed with exit code $LASTEXITCODE"
          }

      - name: Push Chocolatey package
        if: ${{ env.SKIP_CHOCO_PUSH != 'true' }}
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = "setup/choco/servy/servy.${env:VERSION}.0.nupkg"
          if (-not (Test-Path $nupkg)) {
              throw "Expected nupkg not found at '$nupkg' - choco pack likely did not produce it."
          }
          choco push $nupkg --source "https://community.chocolatey.org/api/v2/package" --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) {
              throw "choco push failed with exit code $LASTEXITCODE"
          }
