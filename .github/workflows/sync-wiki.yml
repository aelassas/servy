# ==========================================================================================
# Sync translated wiki markdown from /wiki to the repository GitHub Wiki
# ------------------------------------------------------------------------------------------
# Requires: Settings → Features → Wikis enabled, and at least one page created once
# (GitHub does not create the *.wiki.git remote until the first page exists).
# ==========================================================================================

name: sync-wiki

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync wiki/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Publish wiki/
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          path: wiki/
          ignore: |
            .gitignore
            Clean-TrailingSpaces.ps1
