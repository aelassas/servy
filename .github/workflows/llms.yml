# ==========================================================================================
# GitHub Actions Workflow - LLM Full Documentation Concatenation
# ------------------------------------------------------------------------------------------
# Triggered on wiki updates (gollum), on pushes to main that change llms.txt or this
# workflow, and on-demand execution.
# - generate-llms-full:
#     1. Checks out the Servy Wiki repository.
#     2. Concatenates all Markdown documentation (.md) into a single, structured
#        llms-full.txt file for full-context LLM processing, in _Sidebar.md reading order,
#        with relative wiki links rewritten to absolute URLs.
#     3. Commits and pushes llms-full.txt to the root of the main repository.
#     4. Commits and pushes llms.txt and llms-full.txt to the servy-win.github.io
#        repository in the public/ directory.
# ==========================================================================================

name: llms

on:
  gollum:
  push:
    branches:
      - main
    paths:
      - llms.txt
      - .github/workflows/llms.yml
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs: a wiki save queueing behind an active run will wait
# for it to finish rather than cancelling it.
concurrency:
  group: llms
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: "github-actions[bot]"
  GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  generate-llms-full:
    name: Generate and Deploy llms-full.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Generate llms-full.txt
        shell: bash
        env:
          WIKI_URL: ${{ github.server_url }}/${{ github.repository }}/wiki
        run: |
          # 1. Ensure the wiki directory exists and contains markdown files
          if [ ! -d ".wiki" ] || [ -z "$(find .wiki -maxdepth 2 -type f -name '*.md' -print -quit)" ]; then
            echo "::error::Wiki repository appears empty or inaccessible."
            exit 1
          fi

          OUTPUT_FILE="llms-full.txt"
          ORDER_FILE="$RUNNER_TEMP/llms-order.tsv"

          # 2. Add header information to the concatenated file
          {
            echo "# Servy - Full Documentation Context"
            echo ""
            echo "> Auto-generated full documentation context compiled from the Servy Wiki."
            echo "> Generated on: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "---"
            echo ""
          } > "$OUTPUT_FILE"

          # 3. Build the reading order as "<path><TAB><title>" lines: the pages _Sidebar.md links
          #    to, in sidebar order and with the sidebar label as title (Home first), then every
          #    page the sidebar does not list, in sorted path order, titled from its file name.
          #    _Sidebar.md and _Footer.md themselves are skipped.
          : > "$ORDER_FILE"
          if [ -f .wiki/_Sidebar.md ]; then
            while IFS=$'\t' read -r page title; do
              if [ ! -f ".wiki/$page.md" ]; then
                echo "::warning::_Sidebar.md links to a wiki page that does not exist: $page"
              elif ! cut -f1 "$ORDER_FILE" | grep -qxF ".wiki/$page.md"; then
                printf '%s\t%s\n' ".wiki/$page.md" "$title" >> "$ORDER_FILE"
              fi
            done < <(grep -oE '\[[^]]+\]\(\./[^)#]+' .wiki/_Sidebar.md | sed -E 's/^\[([^]]+)\]\(\.\/(.*)$/\2\t\1/')
          fi
          find .wiki -maxdepth 2 -type f -name '*.md' | sort | while read -r file; do
            filename=$(basename "$file" .md)
            if [[ "$filename" == "_Sidebar" || "$filename" == "_Footer" ]]; then
              continue
            fi
            if ! cut -f1 "$ORDER_FILE" | grep -qxF "$file"; then
              printf '%s\t%s\n' "$file" "${filename//-/ }" >> "$ORDER_FILE"
            fi
          done

          # 4. Concatenate the pages. Relative links only resolve inside the wiki, so "](./Page"
          #    and same-page "](#anchor" links are rewritten to absolute wiki URLs.
          while IFS=$'\t' read -r file title; do
            filename=$(basename "$file" .md)
            page_url="$WIKI_URL/$filename"
            # Escape '&' (page names such as Logging-&-Log-Rotation) for the sed replacement
            page_url_sed=${page_url//&/\\&}

            echo "Appending: $filename"

            {
              echo "# Document: $title"
              echo ""
              echo "> Source: $page_url"
              echo ""
              sed -E -e "s|\]\(\./|](${WIKI_URL}/|g" -e "s|\]\(#|](${page_url_sed}#|g" "$file"
              echo ""
              echo ""
              echo "---"
              echo ""
            } >> "$OUTPUT_FILE"
          done < "$ORDER_FILE"

          echo "Successfully generated $OUTPUT_FILE ($(du -h "$OUTPUT_FILE" | cut -f1))"

      - name: Checkout Main Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: main-repo

      - name: Deploy llms-full.txt to Main Repository Root
        shell: bash
        run: |
          cd main-repo
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # 1. Pull latest changes first so local branch is up to date
          git pull origin main --rebase

          # 2. Compare generated body with the updated main-repo file
          if ! diff -q --strip-trailing-cr <(tail -n +8 ../llms-full.txt) <(tail -n +8 llms-full.txt) >/dev/null 2>&1; then
            CHANGED=1
          else
            CHANGED=0
          fi

          # 3. Overwrite with the newly generated file
          cp ../llms-full.txt llms-full.txt

          # 4. Commit and push if changed
          if [ "$CHANGED" = 1 ]; then
            git add llms-full.txt
            git commit -m "docs: sync llms-full.txt from wiki updates"
            git push
            echo "Successfully updated and pushed llms-full.txt to main repository"
          else
            echo "No changes detected in llms-full.txt for main repo. Skipping commit."
          fi

      - name: Checkout Web Repository (servy-win.github.io)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: servy-win/servy-win.github.io
          token: ${{ secrets.GH_PAT_SERVY_WIN }}
          path: web-repo

      - name: Deploy llms.txt and llms-full.txt to Website Repository
        shell: bash
        run: |
          cd web-repo
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # 1. Pull latest changes first so local branch is up to date
          git pull --rebase

          # 2. Ensure target directory exists
          mkdir -p public

          # 3. Compare the body of llms-full.txt (everything after the 7-line generated header,
          #    which carries a timestamp) and the whole of llms.txt with the committed copies,
          #    ignoring line endings
          CHANGED=0
          if ! diff -q --strip-trailing-cr <(tail -n +8 ../llms-full.txt) <(tail -n +8 public/llms-full.txt) >/dev/null 2>&1; then
            CHANGED=1
          fi
          if ! diff -q --strip-trailing-cr ../main-repo/llms.txt public/llms.txt >/dev/null 2>&1; then
            CHANGED=1
          fi

          # 4. Copy both files to public/ with LF line endings, then commit and push if changed
          if [ "$CHANGED" = 1 ]; then
            cp ../llms-full.txt public/llms-full.txt
            tr -d '\r' < ../main-repo/llms.txt > public/llms.txt
            git add public/llms.txt public/llms-full.txt
            git commit -m "docs: sync llms.txt and llms-full.txt from servy"
            git push
            echo "Successfully updated and pushed llms.txt and llms-full.txt to servy-win.github.io"
          else
            echo "No changes detected in llms.txt or llms-full.txt. Skipping commit."
          fi
