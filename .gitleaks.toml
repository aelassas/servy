title = '''Custom Gitleaks configuration'''

[extend]
useDefault = true

[[allowlists]]
description = "Internal HKDF-derived key field, not a literal secret"
condition = "AND"
paths = [
  '''src/Servy\.Core/Security/SecureData\.cs''',
  '''tests/Servy\.Core\.UnitTests/Security/SecureDataTests\.cs''',
  '''tests/Servy\.Infrastructure\.IntegrationTests/Data/ServiceRepositoryIntegrationTests\.cs''',
  '''tests/Servy\.Core\.UnitTests/EnvironmentVariables/EnvironmentVariablesValidatorTests\.cs''',
]
regexes = [
  '''_v2EncryptionKey''',
]
